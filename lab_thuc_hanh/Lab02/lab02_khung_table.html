<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>BookStore</title>
</head>

<body>
  <table width="1000" align="center" border="1" cellpadding="0" cellspacing="0">

    <tr>
      <td>
        <table border="0" cellpadding="0" cellspacing="0" width="100%">
          <tr>
            <td bgcolor="pink" height="173" width="300" align="center" valign="middle">
              Logo
            </td>
            <td bgcolor="paleturquoise" width="700" align="center">
              Banner
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <tr>
      <td height="70">
        <table border="1" width="100%" height="70" style="border-collapse: separate; background-color: #f0f0f0;">
          <tr style="outline: 3px double #888;">
            <td width="20%" align="center" bgcolor="#ffffff" style="border: 1px solid #000;">1</td>
            <td width="20%" align="center" bgcolor="#ffffff" style="border: 1px solid #000;">2</td>
            <td width="20%" align="center" bgcolor="#ffffff" style="border: 1px solid #000;">3</td>
            <td width="20%" align="center" bgcolor="#ffffff" style="border: 1px solid #000;">4</td>
            <td width="20%" align="center" bgcolor="#ffffff" style="border: 1px solid #000;">5</td>
          </tr>
        </table>
      </td>
    </tr>

    <tr><td height="10"></td></tr>

    <tr>
      <td>
        <table width="100%" border="0" cellpadding="0" cellspacing="0">
          <tr>
            <td width="196" valign="top">
              <table border="1" width="100%" cellspacing="2" cellpadding="0" style="background-color: #f0f0f0; border-collapse: separate;">
                <tr><td height="50" align="center" bgcolor="#C1E1C1" style="border: 1px solid #888;">1</td></tr>
                <tr><td height="50" align="center" bgcolor="#C1E1C1" style="border: 1px solid #888;">2</td></tr>
                <tr><td height="50" align="center" bgcolor="#C1E1C1" style="border: 1px solid #888;">3</td></tr>
                <tr><td height="50" align="center" bgcolor="#C1E1C1" style="border: 1px solid #888;">4</td></tr>
                <tr><td height="50" align="center" bgcolor="#C1E1C1" style="border: 1px solid #888;">5</td></tr>
              </table>
            </td>

            <td width="24"></td>

            <td width="560" align="center" valign="middle" style="border:1px solid #ccc; height: 260px;">
              Content
            </td>

            <td width="24"></td>

            <td width="196" valign="top">
              <table border="1" width="100%" cellspacing="2" cellpadding="0" style="background-color: #f0f0f0; border-collapse: separate;">
                <tr><td height="50" align="center" bgcolor="#C1E1C1" style="border: 1px solid #888;">1</td></tr>
                <tr><td height="50" align="center" bgcolor="#C1E1C1" style="border: 1px solid #888;">2</td></tr>
                <tr><td height="50" align="center" bgcolor="#C1E1C1" style="border: 1px solid #888;">3</td></tr>
                <tr><td height="50" align="center" bgcolor="#C1E1C1" style="border: 1px solid #888;">4</td></tr>
                <tr><td height="50" align="center" bgcolor="#C1E1C1" style="border: 1px solid #888;">5</td></tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <tr><td height="10"></td></tr>

    <tr>
      <td height="60" align="center" style="border:3px solid #b2b2cc;"> Footer </td>
    </tr>

  </table>
</body>

</html>
