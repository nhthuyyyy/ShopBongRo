        body { font-family: Arial, sans-serif; background-color: #f0f0f0; }
        .form-container {

            padding: 20px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        h2 { text-align: center; font-size: 18px; margin-bottom: 20px; }
        .form-row { display: flex; margin-bottom: 12px; align-items: flex-start; }
        .form-row label { width: 130px; font-size: 14px; flex-shrink: 0; }
        .form-row input[type="text"], .form-row select, .form-row textarea {
            flex: 1; padding: 4px; border: 1px solid #ccc;
        }
        .input-group { display: flex; align-items: center; gap: 8px; flex: 1; }
        .short { width: 60px; flex: none !important; }
        .medium { width: 100px; flex: none !important; }
        .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; flex: 1; }
        .checkbox-grid label { width: auto; font-size: 13px; display: flex; align-items: center; gap: 5px; }
        .button-group { text-align: center; margin-top: 20px; display: flex; justify-content: center; gap: 10px; }

            <!-- CONTENT hiển thị ở giữa  -->
            <div id="content">
                <div class="form-container">
                    <h2>THÊM SẢN PHẨM MỚI</h2>
                    
                    <form action="xlThem.php" method="POST" enctype="multipart/form-data">
                        
                        <div class="form-row">
                            <label>Mã sản phẩm</label>
                            <input type="text" name="nmProID">
                        </div>
                
                        <div class="form-row">
                            <label>Tên sản phẩm</label>
                            <input type="text" name="nmProName">
                        </div>
                
                        <div class="form-row">
                            <label>Hình ảnh</label>
                            <input type="file" name="nmProImg">
                        </div>
                
                        <div class="form-row">
                            <label>Hãng sản xuất</label>
                            <select name="nmMan">
                                <option value="Thiên Long">Thiên Long</option>
                                <option value="Bến Nghé">Bến Nghé</option>
                            </select>
                        </div>
                
                        <div class="form-row">
                            <label>Kích thước</label>
                            <div class="input-group">
                                W: <input type="text" name="nmWidth" class="short">
                                H: <input type="text" name="nmHeight" class="short"> mm
                            </div>
                        </div>
                
                        <div class="form-row">
                            <label>Số trang</label>
                            <div class="input-group">
                                <input type="text" name="nmCount" class="medium"> trang
                            </div>
                        </div>
                
                        <div class="form-row">
                            <label>Tác giả</label>
                            <input type="text" name="nmTacGia">
                        </div>
                
                        <div class="form-row">
                            <label>Giá</label>
                            <div class="input-group">
                                <input type="text" name="nmPrice" class="medium">
                                <span>Màu:</span>
                                <input type="color" name="nmColor">
                            </div>
                        </div>
                
                        <div class="form-row">
                            <label>Xuất xứ</label>
                            <input type="text" name="nmLive">
                        </div>
                
                        <div class="form-row">
                            <label>Thể Loại</label>
                            <div class="checkbox-grid">
                                <label><input type="checkbox" name="nmFunctions[]" value="Văn học"> Văn học</label>
                                <label><input type="checkbox" name="nmFunctions[]" value="Thiếu nhi"> Thiếu nhi</label>
                                <label><input type="checkbox" name="nmFunctions[]" value="Kinh tế"> Kinh tế</label>
                                <label><input type="checkbox" name="nmFunctions[]" value="Giáo khoa"> Giáo khoa</label>
                                <label><input type="checkbox" name="nmFunctions[]" value="Tâm lý"> Tâm lý</label>
                                <label><input type="checkbox" name="nmFunctions[]" value="Ngoại ngữ"> Ngoại ngữ</label>
                            </div>
                        </div>
                
                        <div class="form-row">
                            <label>Mô tả chi tiết</label>
                            <textarea name="nmProDet" rows="5"></textarea>
                        </div>
                
                        <div class="button-group">
                            <button type="submit" name="btnThem">Thêm</button>
                            <button type="reset">Xóa</button>
                        </div>
                    </form>
